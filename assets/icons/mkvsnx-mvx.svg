<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 120" role="img" aria-labelledby="title desc">
  <title id="title">MKVSNX MVX monogram</title>
  <desc id="desc">A geometric M with a central V notch and integrated X, rendered in blue, violet and cyan.</desc>
  <defs>
    <linearGradient id="m" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36d8ff"/>
      <stop offset=".38" stop-color="#4f7cff"/>
      <stop offset=".72" stop-color="#8a50ff"/>
      <stop offset="1" stop-color="#d84cff"/>
    </linearGradient>
    <linearGradient id="x" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6657ff"/>
      <stop offset=".5" stop-color="#a84cff"/>
      <stop offset="1" stop-color="#39e1ff"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".58"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
